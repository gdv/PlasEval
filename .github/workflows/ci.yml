name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - name: Run pytest with coverage
        run: >
          uv run pytest
          --cov
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-report=xml:coverage.xml
      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.json
            coverage.xml

  coverage-badge:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: Build shields.io endpoint JSON
        run: |
          mkdir badges
          python3 - <<'EOF'
          import json
          pct = round(json.load(open("coverage.json"))["totals"]["percent_covered"])
          color = ("red" if pct < 50 else "orange" if pct < 70
                   else "yellow" if pct < 85 else "green")
          badge = {"schemaVersion": 1, "label": "coverage",
                   "message": f"{pct}%", "color": color}
          json.dump(badge, open("badges/coverage.json", "w"))
          EOF
      - name: Publish to `badges` branch
        working-directory: badges
        run: |
          git init -b badges
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -m "Update coverage badge"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            badges
